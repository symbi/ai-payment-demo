# validate不启动模型；run使用本机Codex默认设置和既有授权。
schema_version: v1alpha1
environment:
  type: none
skills:
- source: local_path
  path: .
engine:
  name: codex
cases:
  files:
  - evals/cases/fill-slot.yaml
  - evals/cases/write-conflict.yaml
  - evals/cases/reconcile.yaml
  - evals/cases/approval-block.yaml
  - evals/cases/worker-stop.yaml
  - evals/cases/machine-model.yaml
  - evals/cases/qa-overlap.yaml
  - evals/cases/no-ready.yaml
  parallelism: 1
report:
  formats:
  - json

# 离线判断案例；不操作真实任务系统。
id: write-conflict
title: 隔离目录不能掩盖文件争写
input:
  prompt: '使用 $symphony-orchestration。以下为离线虚构调度快照，只做判断，不调用工具、不访问外部系统、不启动进程。只输出JSON对象：start、keep_running、blocked、retire为任务ID数组；role_action为coordinate或handoff_and_stop；reason为简短中文理由。start只包含此刻可启动项，不把解除限制后的设想算入。


    你是主控。并发上限2，B正在写shared/policy.ts。C标为Ready，在另一个worktree也要改同一目标shared/policy.ts，尚无交接或冲突解决约定；D是Ready，只写ui/help.ts。C排在D前，其他条件均满足。此刻安排下一步。'
judge:
  type: rule_based
  success:
  - output_matches:
      all:
      - '"start"\s*:\s*\[\s*"D"\s*\]'
      - '"keep_running"\s*:\s*\[\s*"B"\s*\]'
      - '"blocked"\s*:\s*\[\s*"C"\s*\]'
      - '"retire"\s*:\s*\[\s*\s*\]'
      - '"role_action"\s*:\s*"coordinate"'

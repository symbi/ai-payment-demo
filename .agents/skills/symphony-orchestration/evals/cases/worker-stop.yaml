# 离线判断案例；不操作真实任务系统。
id: worker-stop
title: 执行者交付后停止而非自行补位
input:
  prompt: '使用 $symphony-orchestration。以下为离线虚构调度快照，只做判断，不调用工具、不访问外部系统、不启动进程。只输出JSON对象：start、keep_running、blocked、retire为任务ID数组；role_action为coordinate或handoff_and_stop；reason为简短中文理由。start只包含此刻可启动项，不把解除限制后的设想算入。


    你是实现Worker，固定任务包只允许完成W。W已完成，产物和真实测试结果已保存。你看见Ready卡N和一个空位，但没有调度角色；host负责撤销W领取标签。安排自己的下一步。'
judge:
  type: rule_based
  success:
  - output_matches:
      all:
      - '"start"\s*:\s*\[\s*\s*\]'
      - '"keep_running"\s*:\s*\[\s*\s*\]'
      - '"blocked"\s*:\s*\[\s*\s*\]'
      - '"retire"\s*:\s*\[\s*\s*\]'
      - '"role_action"\s*:\s*"handoff_and_stop"'

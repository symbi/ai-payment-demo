# 离线判断案例；不操作真实任务系统。
id: fill-slot
title: 空位补入独立就绪任务
input:
  prompt: '使用 $symphony-orchestration。以下为离线虚构调度快照，只做判断，不调用工具、不访问外部系统、不启动进程。只输出JSON对象：start、keep_running、blocked、retire为任务ID数组；role_action为coordinate或handoff_and_stop；reason为简短中文理由。start只包含此刻可启动项，不把解除限制后的设想算入。


    你是主控。并发上限2，资源充足，模型均可用。A已交付且退出领取，B正在写ui.ts。Q是整体验收，依赖A与B在同一固定版本集成，尚未满足；D为已授权Ready任务，仅写docs/help.md，输入与检查均满足。此刻安排下一步。'
judge:
  type: rule_based
  success:
  - output_matches:
      all:
      - '"start"\s*:\s*\[\s*"D"\s*\]'
      - '"keep_running"\s*:\s*\[\s*"B"\s*\]'
      - '"blocked"\s*:\s*\[\s*"Q"\s*\]'
      - '"retire"\s*:\s*\[\s*\s*\]'
      - '"role_action"\s*:\s*"coordinate"'

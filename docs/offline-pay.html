<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'none'; font-src 'none'; form-action 'none'; base-uri 'none'">
<title>付款评估演示</title><style>:root{color-scheme:light;--bg:#f3f6fa;--paper:#fff;--ink:#10243e;--muted:#566579;--line:#d6dee8;--blue:#174ea6;--blue-dark:#103b80;--green:#176546;--green-bg:#e7f5ee;--amber:#835200;--amber-bg:#fff3d8;--red:#a12638;--red-bg:#fdebed;--focus:#d37a00;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55}.demo-shell{max-width:1240px;margin:0 auto;padding:34px 24px 48px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;padding:10px 4px 30px}.kicker{margin:0 0 8px;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.18em}.hero h1{max-width:760px;margin:0;font-size:clamp(30px,4vw,48px);line-height:1.15;letter-spacing:-.035em}.lead{max-width:760px;margin:14px 0 0;color:var(--muted);font-size:17px}.simulation-badge{flex:0 0 auto;border:1px solid #a7bbd5;border-radius:999px;background:#edf3fb;color:#244c7e;padding:8px 14px;font-size:13px;font-weight:700}.dashboard{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(380px,.95fr);gap:20px;align-items:start}.left-column{display:grid;gap:20px}.panel{min-width:0;border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:26px;box-shadow:0 8px 24px rgba(24,49,83,.045)}.decision-panel{position:sticky;top:20px}.step-heading{display:flex;align-items:center;gap:14px;margin-bottom:22px}.step-heading>span{display:grid;width:46px;height:46px;place-items:center;border-radius:12px;background:var(--ink);color:#fff;font-size:15px;font-weight:800}.step-heading p{margin:0;color:var(--muted);font-size:12px;font-weight:700}.step-heading h2{margin:0;font-size:23px;line-height:1.2}.wallet-status{display:flex;justify-content:space-between;gap:12px;border:1px solid #b9cce3;border-radius:12px;background:#f3f7fc;padding:15px 16px}.wallet-status strong,.wallet-status span{display:block}.wallet-status span{color:var(--muted);font-size:13px}.facts{margin:18px 0}.facts div,.evidence div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #e8edf3;padding:10px 0}.facts dt,.evidence dt{color:var(--muted)}.facts dd,.evidence dd{margin:0;text-align:right;font-weight:650}.explain,.boundary-note{border-left:3px solid #91aed1;margin:16px 0;padding:2px 0 2px 13px;color:var(--muted);font-size:14px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field-grid label,label{display:block;font-weight:700}.field-grid label span{display:block;color:var(--muted);font-size:12px;font-weight:500}input,select,button{font:inherit}input:not([type=checkbox]),select{width:100%;min-height:46px;margin-top:7px;border:1px solid #7f91a6;border-radius:9px;background:#fff;color:var(--ink);padding:10px 12px}button,select,input{touch-action:manipulation}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.helper{margin:10px 0 0;color:var(--muted);font-size:13px}.order-name{display:grid;gap:2px;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;padding:14px 16px}.order-name span,.order-name small{color:var(--muted);font-size:13px}.order-name strong{font-size:18px}.recipient{margin-top:14px;border-radius:13px;background:#f7f9fc;padding:17px}.recipient>div:first-child{display:flex;align-items:center;justify-content:space-between;gap:12px}.recipient>div:first-child span{color:var(--blue);font-size:12px;font-weight:800}.recipient code{display:block;overflow-wrap:anywhere;margin:12px 0;border-radius:8px;background:#e9eff6;padding:10px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.evidence{margin:0}.evidence div{align-items:flex-start}.evidence dt{flex:0 0 86px;font-size:13px}.evidence dd{text-align:left;font-size:13px}.recipient>p{margin:12px 0 0;color:var(--muted);font-size:14px}.toggle{display:flex;align-items:flex-start;gap:12px;min-height:48px;margin-top:18px;border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer}.toggle input{width:20px;height:20px;flex:0 0 auto;margin:2px}.toggle span,.toggle small{display:block}.toggle small{color:var(--muted);font-weight:500}.decision-intro{color:var(--muted)}.pay-button{width:100%;min-height:54px;border:0;border-radius:11px;background:var(--blue);color:#fff;padding:13px 18px;font-size:18px;font-weight:800;cursor:pointer}.pay-button:hover:not(:disabled){background:var(--blue-dark)}.pay-button:disabled{cursor:wait;opacity:.68}.no-payment{margin:9px 0;color:var(--muted);font-size:13px;text-align:center}.notice{min-height:44px;margin:18px 0 0;border-radius:9px;background:#edf3fb;color:#244c7e;padding:10px 12px;font-size:14px;font-weight:650}.notice.error{background:var(--red-bg);color:var(--red)}.empty-result{display:grid;place-items:center;min-height:230px;margin-top:16px;border:1px dashed #abb8c7;border-radius:13px;color:var(--muted);text-align:center;padding:22px}.empty-result span{font-size:46px}.result{margin-top:16px;border:1px solid var(--line);border-top:6px solid var(--ink);border-radius:13px;padding:20px}.result.allow{border-top-color:var(--green);background:linear-gradient(180deg,var(--green-bg),#fff 90px)}.result.hold{border-top-color:var(--amber);background:linear-gradient(180deg,var(--amber-bg),#fff 90px)}.result.deny,.result.invalid{border-top-color:var(--red);background:linear-gradient(180deg,var(--red-bg),#fff 90px)}.result-label{margin:0;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.08em}.result h3{margin:4px 0 10px;font-size:34px}.plain-reason{font-size:17px;font-weight:650}.next-step{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.next-step p{margin:4px 0}.errors{color:var(--red);padding-left:20px}.execution-state{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:16px;border-radius:10px;background:#f1f4f8;padding:13px;font-size:13px}.execution-state strong{grid-column:1/-1}.allow-boundary{color:var(--muted);font-size:13px}.advanced{margin-top:20px;border-top:1px solid var(--line);padding-top:10px}.advanced summary{min-height:44px;padding:10px 2px;cursor:pointer;font-weight:750}.advanced>p{color:var(--muted);font-size:13px}.weight-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.weight-list label{font-size:13px}.weight-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.weight-actions button{min-height:44px;border:1px solid #9dabbc;border-radius:8px;background:#eef2f7;color:var(--ink);padding:8px 12px;cursor:pointer}.formula{border-left:3px solid var(--blue);padding-left:12px}.contributions{margin-top:14px}.contributions>div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e5eaf0;padding:10px 0;font-size:14px}.contributions span small{display:block;color:var(--muted)}.contributions strong{text-align:right}.contributions .total{border-bottom:0;font-size:17px}footer{padding:24px 4px 0;color:var(--muted);font-size:13px}@media(max-width:880px){.dashboard{grid-template-columns:1fr}.decision-panel{position:static}.hero{display:block}.simulation-badge{display:inline-block;margin-top:18px}}@media(max-width:520px){.demo-shell{padding:18px 12px 34px}.hero{padding-bottom:22px}.panel{padding:19px;border-radius:14px}.field-grid,.weight-list{grid-template-columns:1fr}.wallet-status,.recipient>div:first-child,.weight-actions{align-items:flex-start;flex-direction:column}.facts div,.evidence div{display:block}.facts dd,.evidence dd{text-align:left;margin-top:3px}.execution-state{grid-template-columns:1fr}.hero h1{font-size:31px}.result h3{font-size:29px}.step-heading>span{width:44px;height:44px}}

.score-summary {display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #cbd5e1;} .score-summary strong{font-size:1.5rem;}
